server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:ecoconce;MODE=Oracle;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  frontend-url: http://localhost:5500

jwt:
  secret: ${JWT_SECRET:ecoconce_9a72df93a4b5c6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2}
